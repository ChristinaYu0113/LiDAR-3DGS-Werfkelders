name: Inspect provincial ICH dataset download

on:
  push:
    branches:
      - chatgpt-provincial-ich-fetch-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-data-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect GeoDOI download links
        shell: python
        run: |
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path("geodoi_inspection")
          out.mkdir(exist_ok=True)
          urls = [
              "https://geodoi.ac.cn/WebEn/geodoi.aspx?Id=3650",
              "https://geodoi.ac.cn/WebCn/geodoi.aspx?ID=3650",
              "https://geodoi.ac.cn/DOIPaper/HTML/2024139402/202402139411.html",
          ]
          findings = []
          for index, url in enumerate(urls, start=1):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      charset = response.headers.get_content_charset() or "utf-8"
                      text = raw.decode(charset, errors="replace")
                      final_url = response.geturl()
                      status = response.status
              except Exception as exc:
                  findings.append({"url": url, "error": repr(exc)})
                  print(url, repr(exc))
                  continue
              (out / f"page_{index}.html").write_text(text, encoding="utf-8")
              hrefs = re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, flags=re.I)
              candidates = []
              for href in hrefs:
                  decoded = html.unescape(href)
                  absolute = urllib.parse.urljoin(final_url, decoded)
                  if any(token in absolute.lower() for token in ["down", "download", ".rar", ".zip", ".xls", "fileid", "3650"]):
                      candidates.append(absolute)
              contexts = []
              for token in ["ProvICH_China_2005-2024", "down.aspx", "fileID", ".rar", "Download", "下载"]:
                  for match in re.finditer(re.escape(token), text, flags=re.I):
                      contexts.append(text[max(0, match.start()-300):match.end()+500])
              record = {
                  "url": url,
                  "final_url": final_url,
                  "status": status,
                  "length": len(text),
                  "candidate_links": sorted(set(candidates)),
                  "contexts": contexts[:50],
              }
              findings.append(record)
              print(json.dumps(record, ensure_ascii=False, indent=2)[:20000])
          (out / "findings.json").write_text(json.dumps(findings, ensure_ascii=False, indent=2), encoding="utf-8")

      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: geodoi-inspection
          path: geodoi_inspection
          if-no-files-found: error
          retention-days: 7
