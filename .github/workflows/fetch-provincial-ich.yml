name: Download provincial ICH dataset archive

on:
  push:
    branches:
      - chatgpt-provincial-ich-fetch-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download GeoDOI provincial ICH archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provincial_ich_archive
          curl --fail --location --retry 5 --retry-delay 2 \
            --user-agent 'Mozilla/5.0' \
            --referer 'https://geodoi.ac.cn/WebCn/geodoi.aspx?ID=3650' \
            'https://geodoi.ac.cn/WebCn/down.aspx?fileID=8796&size=10884116' \
            --output provincial_ich_archive/ProvICH_China_2005-2024.rar
          ls -lh provincial_ich_archive/ProvICH_China_2005-2024.rar
          file provincial_ich_archive/ProvICH_China_2005-2024.rar
          test "$(stat -c%s provincial_ich_archive/ProvICH_China_2005-2024.rar)" -gt 1000000
          sha256sum provincial_ich_archive/ProvICH_China_2005-2024.rar > provincial_ich_archive/SHA256SUMS.txt

      - name: Upload dataset archive
        uses: actions/upload-artifact@v4
        with:
          name: provincial-ich-dataset-archive
          path: provincial_ich_archive
          if-no-files-found: error
          retention-days: 7
