name: Fetch provincial ICH traditional dance data

on:
  push:
    branches:
      - chatgpt-provincial-ich-fetch-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and normalize provincial traditional-dance records
        shell: python
        run: |
          import csv
          import json
          import time
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          endpoint = "https://www.resapi.cn/v1/ich/projects"
          category = "传统舞蹈"
          page_size = 100
          out = Path("provincial_ich_output")
          out.mkdir(exist_ok=True)
          fetched_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          records = []
          page = 1
          total_pages = None
          total = None
          data_version = ""

          while True:
              params = urllib.parse.urlencode({
                  "category": category,
                  "page": page,
                  "page_size": page_size,
              })
              url = f"{endpoint}?{params}"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "Academic-ICH-Registry-Research/1.0",
              })
              last_error = None
              for attempt in range(1, 7):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                          if not data_version:
                              data_version = response.headers.get("X-Data-Version-ICH", "")
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt == 6:
                          raise
                      time.sleep(min(30, 2 ** attempt))

              data = payload.get("data")
              meta = payload.get("meta") or {}
              if data is None and isinstance(payload.get("result"), dict):
                  data = payload["result"].get("data")
                  meta = payload["result"].get("meta") or meta
              if not isinstance(data, list):
                  raise RuntimeError(f"Unexpected response keys: {list(payload.keys())}")

              total_pages = int(meta.get("total_pages") or total_pages or 1)
              total = meta.get("total", total)
              print(f"page {page}/{total_pages}: {len(data)} records")

              for item in data:
                  records.append({
                      "record_id": item.get("id") or item.get("record_id") or "",
                      "province": item.get("province") or "",
                      "province_en": item.get("province_en") or "",
                      "city": item.get("city") or "",
                      "city_en": item.get("city_en") or "",
                      "batch": item.get("batch") or "",
                      "batch_en": item.get("batch_en") or "",
                      "publish_year": item.get("publish_year") or item.get("year") or "",
                      "category": item.get("category") or "",
                      "category_en": item.get("category_en") or "",
                      "project_name": item.get("project_name") or item.get("name") or "",
                      "project_name_en": item.get("project_name_en") or "",
                      "data_version": data_version,
                      "source_url": endpoint,
                      "fetched_at_utc": fetched_at,
                  })

              if page >= total_pages or not data:
                  break
              page += 1
              time.sleep(0.25)

          seen = set()
          unique = []
          for row in records:
              key = ("id", str(row["record_id"])) if row["record_id"] else (
                  "composite", row["province"], row["city"], row["batch"],
                  str(row["publish_year"]), row["category"], row["project_name"]
              )
              if key not in seen:
                  seen.add(key)
                  unique.append(row)

          unique.sort(key=lambda r: (
              r["province"], r["city"], str(r["publish_year"]),
              r["batch"], r["project_name"]
          ))

          fields = [
              "record_id", "province", "province_en", "city", "city_en",
              "batch", "batch_en", "publish_year", "category", "category_en",
              "project_name", "project_name_en", "data_version", "source_url",
              "fetched_at_utc"
          ]
          csv_path = out / "provincial_traditional_dance_2005_2024.csv"
          with csv_path.open("w", encoding="utf-8-sig", newline="") as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              writer.writerows(unique)

          manifest = {
              "endpoint": endpoint,
              "category_query": category,
              "fetched_at_utc": fetched_at,
              "data_version": data_version,
              "api_reported_total": total,
              "api_reported_total_pages": total_pages,
              "raw_records": len(records),
              "unique_records": len(unique),
              "duplicates_removed": len(records) - len(unique),
              "province_counts": dict(Counter(r["province"] for r in unique)),
          }
          with (out / "provincial_traditional_dance_2005_2024.json").open("w", encoding="utf-8") as fh:
              json.dump({"manifest": manifest, "records": unique}, fh, ensure_ascii=False, indent=2)
          with (out / "manifest.json").open("w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))

      - name: Upload fetched data
        uses: actions/upload-artifact@v4
        with:
          name: provincial-ich-traditional-dance-data
          path: provincial_ich_output
          if-no-files-found: error
          retention-days: 7
