name: Extract provincial traditional-dance ICH records

on:
  push:
    branches:
      - chatgpt-provincial-ich-fetch-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and extract GeoDOI archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p work extracted output
          curl --fail --location --retry 5 --retry-delay 2 \
            --user-agent 'Mozilla/5.0' \
            --referer 'https://geodoi.ac.cn/WebCn/geodoi.aspx?ID=3650' \
            'https://geodoi.ac.cn/WebCn/down.aspx?fileID=8796&size=10884116' \
            --output work/ProvICH_China_2005-2024.rar
          7z x -y work/ProvICH_China_2005-2024.rar -oextracted
          find extracted -type f -printf '%p\t%s bytes\n' | sort > output/extracted_files.txt

      - name: Filter traditional-dance project records
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyshp
          python <<'PY'
          import csv
          import json
          from pathlib import Path
          import shapefile

          shp_path = Path('extracted/ProvICH_China_2005-2024shp/ProvICH_Projects.shp')
          out = Path('output')
          reader = shapefile.Reader(
              str(shp_path),
              encoding='utf-8',
              encodingErrors='replace',
          )
          fields = [f[0] for f in reader.fields[1:]]
          rows = []
          replacement_char_rows = 0

          for record in reader.iterRecords():
              row = dict(zip(fields, list(record)))
              if str(row.get('CategoryCN', '')).strip() != '传统舞蹈':
                  continue
              clean = {}
              has_replacement = False
              for key, value in row.items():
                  if value is None:
                      value = ''
                  if isinstance(value, float) and value.is_integer() and key in {'Index', 'Time'}:
                      value = int(value)
                  if '\ufffd' in str(value):
                      has_replacement = True
                  clean[key] = value
              clean['_source_shapefile'] = str(shp_path)
              clean['_encoding_warning'] = '含替换字符，需回查原始名录' if has_replacement else ''
              replacement_char_rows += int(has_replacement)
              rows.append(clean)

          if not rows:
              raise RuntimeError('No records with CategoryCN=传统舞蹈 were found.')

          output_fields = fields + ['_source_shapefile', '_encoding_warning']
          with (out / 'provincial_traditional_dance_projects.csv').open('w', encoding='utf-8-sig', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=output_fields, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(rows)

          summary = {
              'source_layer': str(shp_path),
              'source_record_count': len(reader),
              'traditional_dance_record_count': len(rows),
              'rows_with_encoding_replacement': replacement_char_rows,
              'output_fields': output_fields,
          }
          with (out / 'provincial_traditional_dance_projects.json').open('w', encoding='utf-8') as fh:
              json.dump({'summary': summary, 'records': rows}, fh, ensure_ascii=False, indent=2, default=str)
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload filtered records
        uses: actions/upload-artifact@v4
        with:
          name: provincial-traditional-dance-records
          path: output
          if-no-files-found: error
          retention-days: 7
